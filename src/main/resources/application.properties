spring.application.name=AppBibliotecaWeb
# Vercel corta el arranque si el puerto tarda. El esquema se arma después de escuchar.
spring.main.lazy-initialization=true

#path principal
server.port=${PORT:8096}
server.servlet.context-path=/senati
server.forward-headers-strategy=framework

#database connection
# El controlador sale de la URL: MySQL en la PC, PostgreSQL en Render.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/db_biblioteca_web?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

#jpa hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jmx.enabled=false
spring.jpa.open-in-view=true

# Cache de segundo nivel. Solo Libro lleva @Cacheable.
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=jcache
spring.jpa.properties.hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider
spring.jpa.properties.hibernate.javax.cache.missing_cache_strategy=create
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE

# LDAP embebido de la universidad (solo para este proyecto)
spring.ldap.embedded.base-dn=dc=universidad,dc=edu
spring.ldap.embedded.port=8389
spring.ldap.embedded.ldif=classpath:universidad.ldif
spring.ldap.embedded.validation.enabled=false
